name: Release

# Publish to PyPI on a version tag (e.g. v0.1.0) via Trusted Publishing (OIDC) —
# no stored token. One-time setup on PyPI: create a "pending publisher" (or add one
# to the project) with owner=whereq, repo=whereq-cloud-python, workflow=release.yml,
# environment=pypi. See https://docs.pypi.org/trusted-publishers/
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write        # OIDC token for PyPI Trusted Publishing

jobs:
  publish:
    name: build · publish to PyPI
    runs-on: ubuntu-24.04          # pinned — see note in ci.yml
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Fail fast on a stale version. The build publishes the version in
      # pyproject.toml, not the tag string — so a tag left over from the
      # previous release would try to re-upload a version PyPI already has
      # ("file already exists") instead of the release you meant to ship.
      - name: verify the tag matches the package version
        run: |
          pkg_version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg_version"
            exit 1
          fi
          echo "Publishing version $pkg_version"
      - run: pip install -e . pytest && python -m pytest -q   # green bar before publish
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
