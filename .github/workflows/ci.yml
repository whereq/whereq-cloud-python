name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: `ubuntu-latest` moved to Ubuntu 26.04, which ships no Python 3.9 build
    # (and pyproject declares requires-python = ">=3.9"). 24.04 has 3.9 + 3.12.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: python -m pytest -q
